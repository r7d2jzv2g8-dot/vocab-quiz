<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary + Punctuation Practice</title>
<link rel="manifest" href="vocab-manifest.json">
<meta name="theme-color" content="#14181F">
<link rel="apple-touch-icon" href="vocab-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14181F; --surface: #1C222C; --surface-raised: #232A36; --border: #2A3140;
    --text: #E8EAED; --text-muted: #8B93A1; --correct: #4FB8A6; --incorrect: #D64550;
    --mark-dash: #C97FB0; --mark-hyphen: #D5A45B; --mark-colon: #4F9FB8; --mark-semi: #9B7FD1;
    --def-color: #7FA37F; --weak-color: #D5A45B; --streak-color: #E0935B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ---------- Hangman ---------- */
  .hm-lives { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
  .hm-life { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .hm-life-on { background: var(--incorrect); }
  .hm-life-off { background: var(--border); }
  .hm-lives-label { font-size: 12.5px; color: var(--text-muted); margin-left: 6px; }
  .hm-clue { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
  .hm-word { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .hm-char { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; min-width: 20px; text-align: center; border-bottom: 3px solid var(--border); padding-bottom: 4px; }
  .hm-char.hm-punct { border-bottom: none; color: var(--text-muted); }
  .hm-result { padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hm-win { background: rgba(79,184,166,0.12); color: var(--correct); }
  .hm-lose { background: rgba(214,69,80,0.12); color: var(--incorrect); }
  .focus-btn-inline { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .hm-keyboard { display: flex; flex-direction: column; gap: 6px; }
  .hm-kb-row { display: flex; gap: 5px; justify-content: center; margin: 0 auto; width: 100%; }
  .hm-kb-row-1 { max-width: 100%; }
  .hm-kb-row-2 { max-width: 90%; }
  .hm-kb-row-3 { max-width: 70%; }
  .hm-key { flex: 1; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 6px; padding: 10px 0; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; text-transform: uppercase; }
  .hm-key:disabled { cursor: default; }
  .hm-key-correct { background: rgba(79,184,166,0.18); border-color: var(--correct); color: var(--correct); }
  .hm-key-wrong { background: rgba(214,69,80,0.1); border-color: var(--border); color: var(--text-muted); opacity: 0.5; }

  /* ---------- Spelling Bee ---------- */
  .bee-score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--text-muted); }
  .bee-score { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text); }
  .bee-goal-row { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-bottom: 16px; }
  .bee-input { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; text-align: center; min-height: 36px; letter-spacing: 2px; margin-bottom: 8px; }
  .bee-message { text-align: center; font-size: 13px; color: var(--weak-color); min-height: 18px; margin-bottom: 16px; }
  .bee-hex-wrap { position: relative; width: 260px; height: 230px; margin: 0 auto 20px; }
  .bee-cell { position: absolute; width: 76px; height: 76px; border-radius: 16px; border: none; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; cursor: pointer; top: 50%; left: 50%; }
  .bee-cell-center { background: var(--weak-color); color: #14181F; transform: translate(-50%, -50%); z-index: 2; }
  .bee-cell:not(.bee-cell-center) { background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); }
  .bee-cell-0 { transform: translate(calc(-50% + 78px), -50%); }
  .bee-cell-1 { transform: translate(calc(-50% + 39px), calc(-50% + 67px)); }
  .bee-cell-2 { transform: translate(calc(-50% - 39px), calc(-50% + 67px)); }
  .bee-cell-3 { transform: translate(calc(-50% - 78px), -50%); }
  .bee-cell-4 { transform: translate(calc(-50% - 39px), calc(-50% - 67px)); }
  .bee-cell-5 { transform: translate(calc(-50% + 39px), calc(-50% - 67px)); }
  .bee-controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .bee-ctrl-btn { background: var(--surface-raised); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 16px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .bee-submit-btn { background: var(--weak-color); color: #14181F; border-color: var(--weak-color); font-weight: 700; }
  .bee-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .bee-found-section { border-top: 1px solid var(--border); padding-top: 14px; }
  .bee-found-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 10px; }
  .bee-found-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .bee-found-word { background: var(--surface-raised); border-radius: 6px; padding: 4px 9px; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; }
  .bee-found-vocab { background: rgba(213,164,91,0.15); color: var(--weak-color); }
  .bee-empty-note { font-size: 13px; color: var(--text-muted); }

  /* ---------- Dashboard game entry points ---------- */
  .dash-game-row { display: flex; gap: 8px; margin: 8px 0; }
  .dash-game-btn { flex: 1; background: var(--surface-raised); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 11px 0; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }

  /* ---------- Crossword ---------- */
  .cw-current-clue { background: var(--surface-raised); border-left: 3px solid var(--weak-color); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; font-size: 13.5px; line-height: 1.5; min-height: 20px; }
  .cw-settings-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .cw-setting-toggle { font-size: 12px; padding: 5px 10px; border-radius: 12px; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; user-select: none; }
  .cw-setting-toggle.on { background: rgba(79,184,166,0.15); border-color: var(--correct); color: var(--correct); }
  .cw-timer { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); }
  .cw-grid { display: grid; gap: 2px; margin: 0 auto 16px; max-width: 340px; background: var(--border); border: 2px solid var(--border); }
  .cw-cell { position: relative; aspect-ratio: 1; background: var(--surface); }
  .cw-cell-blocked { background: var(--bg); }
  .cw-cell input { width: 100%; height: 100%; border: none; background: transparent; color: var(--text); text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; text-transform: uppercase; padding: 0; }
  .cw-cell input:focus { outline: 2px solid var(--mark-colon); outline-offset: -2px; }
  .cw-cell-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: var(--text-muted); font-family: 'Inter', sans-serif; line-height: 1; }
  .cw-cell-correct input { color: var(--correct); }
  .cw-cell-wrong input { color: var(--incorrect); }
  .cw-cell-empty { background: rgba(214,69,80,0.08); }
  .cw-solved { text-align: center; background: rgba(79,184,166,0.12); color: var(--correct); border-radius: 8px; padding: 10px; margin-bottom: 14px; font-weight: 700; }
  .bee-solved { text-align: center; background: rgba(79,184,166,0.12); color: var(--correct); border-radius: 8px; padding: 10px; margin-bottom: 14px; font-weight: 700; font-size: 13.5px; }
  .cw-check-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .cw-clues-section { border-top: 1px solid var(--border); padding-top: 14px; }
  .cw-clue-group-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 8px; }
  .cw-clue { font-size: 13.5px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
  .cw-clue-num { font-weight: 700; color: var(--weak-color); }
  .cw-cell-revealed input { color: var(--weak-color); }
  .cw-reveal-link { font-size: 11px; color: var(--text-muted); cursor: pointer; text-decoration: underline; margin-left: 4px; white-space: nowrap; }
  .cw-reveal-link:hover { color: var(--text); }
  .cw-hint-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .bee-ctrl-btn:disabled { opacity: 0.4; cursor: default; }



  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 64px; }
  .app { width: 100%; max-width: 720px; }
  .header { margin-bottom: 28px; }
  .header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .header-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: var(--text-muted); text-transform: uppercase; }
  .header-count { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); }
  .header-status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .header-exit { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--text-muted); cursor: pointer; }
  .header-exit:hover { color: var(--text); }
  .tally { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .tally-correct { color: var(--correct); font-weight: 700; }
  .tally-incorrect { color: var(--incorrect); font-weight: 700; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text-muted); border-radius: 3px; transition: width 0.3s ease; }
  .progress-fill.weak-mode { background: var(--weak-color); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  .round-type-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 10px; border-radius: 5px; margin-bottom: 16px; }
  .word-block { margin-bottom: 20px; }
  .word-tag { display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--text); cursor: pointer; transition: color 0.15s ease; user-select: none; }
  .word-tag:hover { color: var(--mark-colon); }
  .word-tag:hover .speak-icon { opacity: 1; }
  .speak-icon { font-size: 17px; opacity: 0.55; transition: opacity 0.15s ease; }
  .word-def { font-size: 14px; color: var(--text-muted); font-style: italic; margin-top: 4px; }
  .q-prompt { font-size: 14.5px; color: var(--text-muted); margin-bottom: 14px; }
  .q-text { font-family: 'Georgia', serif; font-size: 17px; line-height: 1.7; color: var(--text); margin-bottom: 24px; padding: 16px 18px; background: var(--surface-raised); border-radius: 8px; border-left: 3px solid var(--mark-colon); }
  .q-blank { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--mark-colon); background: rgba(79, 159, 184, 0.15); padding: 1px 8px; border-radius: 4px; }
  .choices { display: flex; gap: 10px; margin-bottom: 4px; }
  .choices.stacked { flex-direction: column; }
  .choice { flex: 1; background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: 8px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; }
  .choice.stacked-choice { flex-direction: row; align-items: flex-start; text-align: left; padding: 14px 16px; gap: 12px; }
  .choice:hover:not(.locked) { border-color: var(--text-muted); transform: translateY(-1px); }
  .choice-mark { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; color: var(--text); }
  .choice-letter { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .choice-text { font-size: 14px; line-height: 1.5; color: var(--text); font-style: italic; }
  .choice-name { font-size: 10.5px; color: var(--text-muted); font-family: 'Inter', sans-serif; }
  .choice.correct-answer { border-color: var(--correct); background: rgba(79, 184, 166, 0.1); }
  .choice.correct-answer .choice-mark, .choice.correct-answer .choice-letter { color: var(--correct); }
  .choice.wrong-selected { border-color: var(--incorrect); background: rgba(214, 69, 80, 0.1); }
  .choice.wrong-selected .choice-mark, .choice.wrong-selected .choice-letter { color: var(--incorrect); }
  .choice.locked { cursor: default; }
  .choice.dimmed { opacity: 0.4; }
  .feedback { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); display: none; }
  .feedback.show { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .feedback-verdict { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .feedback-verdict.correct { color: var(--correct); }
  .feedback-verdict.incorrect { color: var(--incorrect); }
  .feedback-sentence { font-family: 'Georgia', serif; font-size: 15px; line-height: 1.6; color: var(--text); margin-bottom: 10px; padding: 12px 14px; background: var(--surface-raised); border-radius: 6px; }
  .feedback-explanation { font-size: 13.5px; line-height: 1.6; color: var(--text-muted); }
  .next-btn { display: none; margin-top: 20px; width: 100%; background: var(--text); color: var(--bg); border: none; border-radius: 8px; padding: 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .next-btn.show { display: block; }

  .dash-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .dash-greeting { font-size: 12.5px; color: var(--text-muted); margin-bottom: 3px; }
  .dash-streak { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .dash-streak-icon { color: var(--streak-color); }
  .dash-settings-btn { background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .dash-settings-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .voice-inline { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .voice-inline-label { font-size: 12px; color: var(--text-muted); }
  .voice-select { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 9px; font-family: 'Inter', sans-serif; font-size: 12.5px; max-width: 180px; }
  .voice-test-btn { background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 6px 11px; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; }
  .voice-test-btn:hover { border-color: var(--mark-colon); color: var(--text); }

  .wotd-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .wotd-card.compact { padding: 16px 20px; }
  .wotd-compact-row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 12px; }
  .wotd-expand-hint { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
  .wotd-card.compact .wotd-label { margin-bottom: 3px; }
  .wotd-card.compact .wotd-word-row { margin-bottom: 0; }
  .wotd-card.compact .wotd-def { margin-top: 14px; }
  .wotd-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 10px; }
  .wotd-word-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wotd-word { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; cursor: pointer; }
  .wotd-word:hover { color: var(--mark-colon); }
  .wotd-def { font-size: 14px; color: var(--text-muted); font-style: italic; margin-bottom: 12px; }
  .wotd-toggle { background: none; border: none; color: var(--mark-colon); font-size: 13px; cursor: pointer; padding: 0; }
  .wotd-sentence { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-family: 'Georgia', serif; font-size: 14.5px; line-height: 1.6; color: var(--text); display: none; }
  .wotd-sentence.show { display: block; }

  .stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface-raised); border-radius: 8px; padding: 14px; text-align: center; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }

  .strong-weak-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .sw-card { background: var(--surface-raised); border-radius: 8px; padding: 14px; }
  .sw-title { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .sw-title.strong { color: var(--correct); }
  .sw-title.weak { color: var(--weak-color); }
  .sw-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); margin: 5px 0; }

  .dash-actions { display: flex; flex-direction: column; gap: 8px; }
  .dash-primary-btn { background: var(--correct); color: #0F1318; border: none; border-radius: 8px; padding: 14px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .dash-due-note { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .dash-weak-btn { background: rgba(213, 164, 91, 0.1); border: 1.5px solid var(--weak-color); border-radius: 8px; padding: 12px; cursor: pointer; text-align: center; color: var(--weak-color); font-weight: 700; font-size: 13.5px; }
  .dash-weak-disabled { border: 1.5px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center; color: var(--text-muted); font-size: 12.5px; opacity: 0.7; }
  .progress-link-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .progress-link-btn:hover { border-color: var(--text-muted); color: var(--text); }

  .picker-screen { text-align: center; padding: 12px 4px; }
  .length-prompt { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 12px; }
  .length-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .length-btn { background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; text-align: center; min-width: 88px; }
  .length-btn:hover { border-color: var(--correct); transform: translateY(-1px); }
  .length-btn-num { display: block; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; color: var(--text); }
  .length-btn-label { display: block; font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

  .report-score { text-align: center; padding: 8px 0 24px; }
  .report-score-num { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; }
  .report-score-label { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .report-section-title { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 18px 0 4px 0; }
  .report-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .report-row:last-child { border-bottom: none; }
  .report-row-name { flex: 1; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .report-row-mark { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .report-row-bar { flex: 1.2; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .report-row-fill { height: 100%; border-radius: 4px; }
  .report-row-pct { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); width: 44px; text-align: right; }
  .mark-practice-link { font-size: 11.5px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .mark-practice-link:hover { color: var(--text); }
  .restart-btn { display: block; width: 100%; margin-top: 24px; background: transparent; color: var(--text-muted); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn-row { display: flex; gap: 10px; margin-top: 24px; }

    .map(([word, s]) => {

      const totalAttempts = s.defTotal + s.punctTotal;
      return { word, totalCorrect, totalAttempts, accuracy: totalAttempts > 0 ? totalCorrect / totalAttempts : null };
    })
    .filter(e => e.totalAttempts > 0);
  if (order === "weakest") entries.sort((a, b) => a.accuracy - b.accuracy || b.totalAttempts - a.totalAttempts);

// scheduled as two INDEPENDENT items, not the word as a whole -- matching
// the same reasoning already used for weak-word tracking (a word you know

// create a pile-up of reviews later), then random fill if there still
// aren't enough to reach the target length.
function buildSRSSelection(targetLength) {
  const all = getAllAspectKeys();
  // "Everything" is a distinct kind of request from normal paced practice --
  // the player is explicitly asking for comprehensive coverage right now,
  // not the steady, managed introduction the cap exists to protect. Only
  // bypass the cap when the request is for the full pool; ordinary session
  // lengths still respect it.
  const isEverythingRequest = targetLength >= all.length;

      ? (targetLength - selected.length)

  if (selected.length < targetLength) {

  else if (state.screen === "progress") app.innerHTML = renderProgressScreen();
  else if (state.screen === "hangman") app.innerHTML = renderHangman();
  else if (state.screen === "bee") app.innerHTML = renderBee();
  else if (state.screen === "crossword") app.innerHTML = renderCrossword();
}

function renderVoiceInline() {

}

function renderPicker() {
  const lengthButtons = LENGTH_OPTIONS.map(opt => `<div class="length-btn" onclick="start(${opt.words})"><span class="length-btn-num">${opt.words}</span><span class="length-btn-label">${opt.label}</span></div>`).join("");

}

function renderHeader() {
  const total = state.rounds.length;
  const pct = (state.i / total) * 100;
  const fillClass = state.weakMode ? "progress-fill weak-mode" : "progress-fill";
  const label = state.sessionLabel || (state.weakMode ? "Weakest Words Session" : "Vocab + Punctuation");
  const answeredSoFar = state.i + (state.answered ? 1 : 0);
  const incorrectSoFar = answeredSoFar - state.score;
  const tally = answeredSoFar > 0 ? `<span class="tally"><span class="tally-correct">&#10003; ${state.score}</span> <span class="tally-incorrect">&#10007; ${incorrectSoFar}</span></span>` : "";
  return `<div class="header"><div class="header-top"><div class="header-title">${label}</div><span class="header-exit" onclick="restart()" role="button" tabindex="0">&larr; Dashboard</span></div><div class="header-status-row"><div class="header-count">Round ${state.i + 1} of ${total}</div>${tally}</div><div class="progress-bar"><div class="${fillClass}" style="width:${pct}%;"></div></div></div>`;
}

function renderWordBlock(w, revealDef) {
  const speakIcon = SPEECH_SUPPORTED ? '<span class="speak-icon">\uD83D\uDD0A</span>' : '';
  const wordClick = SPEECH_SUPPORTED ? `onclick="speakWord('${w.word.replace(/'/g, "\\'")}')"` : '';

function renderQ() {
  const round = state.rounds[state.i];
  const w = round.sourceWord;
  if (round.kind === "definition") {
    const letters = ["A", "B", "C", "D"];
    const choicesHtml = letters.map((l, idx) => {
      const opt = round.options[idx];
      let cls = "choice stacked-choice";
      if (state.answered) { cls += " locked"; if (opt === round.correct) cls += " correct-answer"; else if (opt === state.sel) cls += " wrong-selected"; else cls += " dimmed"; }
      return `<div class="${cls}" onclick="pickDef(${idx})"><span class="choice-letter">${l}</span><span class="choice-text">${esc(opt)}</span></div>`;
    }).join("");
    let fb = `<div class="feedback"></div>`;
    if (state.answered) fb = `<div class="feedback show"><div class="feedback-verdict ${state.sel===round.correct?"correct":"incorrect"}">${state.sel===round.correct?"\u2713 Correct":"\u2717 Incorrect"}</div><div class="feedback-explanation">${esc(round.correct)}</div></div>`;
    return `<div class="round-type-tag" style="background:#7FA37F22; color:#7FA37F;">Definition</div>${renderWordBlock(w, state.answered)}<div class="q-prompt">What does this word mean?</div><div class="choices stacked">${choicesHtml}</div>${fb}<button class="next-btn ${state.answered?"show":""}" onclick="next()">${state.i===state.rounds.length-1?"See Final Report":"Next"}</button></div>`;
  }
  const parts = w.template.split("___");
  const sentenceHtml = parts.length === 2 ? `${esc(parts[0])}<span class="q-blank">___</span>${esc(parts[1])}` : esc(w.template);
  const choicesHtml = MARKS_ORDER.map(m => {
    let cls = "choice";
    if (state.answered) { cls += " locked"; if (m === w.correct) cls += " correct-answer"; else if (m === state.sel) cls += " wrong-selected"; else cls += " dimmed"; }
    return `<div class="${cls}" onclick="pickMark('${m}')"><span class="choice-mark">${m}</span><span class="choice-name">${MARK_NAMES[m]}</span></div>`;
  }).join("");
  let fb = `<div class="feedback"></div>`;
  if (state.answered) { const filled = w.template.replace("___", w.correct); fb = `<div class="feedback show"><div class="feedback-verdict ${state.sel===w.correct?"correct":"incorrect"}">${state.sel===w.correct?"\u2713 Correct":"\u2717 Incorrect"} -- ${MARK_NAMES[w.correct]}</div><div class="feedback-sentence">${esc(filled)}</div><div class="feedback-explanation">${esc(w.explanation)}</div></div>`; }
  return `<div class="round-type-tag" style="background:#4F9FB822; color:#4F9FB8;">Punctuation</div>${renderWordBlock(w, true)}<div class="q-prompt">Which mark correctly completes this sentence?</div><div class="q-text">${sentenceHtml}</div><div class="choices">${choicesHtml}</div>${fb}<button class="next-btn ${state.answered?"show":""}" onclick="next()">${state.i===state.rounds.length-1?"See Final Report":"Next"}</button></div>`;
}

function renderReport() {
  const total = state.rounds.length;
  const pct = ((state.score/total)*100).toFixed(1);
  const defPct = state.defStats.total > 0 ? (state.defStats.correct/state.defStats.total)*100 : 0;
  const markRows = MARKS_ORDER.map(m => {
    const name = MARK_NAMES[m]; const st = state.markStats[name]; if (st.total === 0) return "";
    const p = (st.correct/st.total)*100;
    return `<div class="report-row"><div class="report-row-name"><span class="report-row-mark" style="color:${MARK_COLORS[m]};">${m}</span> ${name}</div><div class="report-row-bar"><div class="report-row-fill" style="width:${p}%; background:${MARK_COLORS[m]};"></div></div><div class="report-row-pct">${st.correct}/${st.total}</div></div>`;
  }).join("");
  const saveNote = STORAGE_SUPPORTED ? '<div class="save-note">This session\'s results have been saved to your overall progress.</div>' : '';
  const pacingNote = (state.requestedLength && total < state.requestedLength)
    ? `<div class="save-note">You asked for ${state.requestedLength} -- this session was ${total}. New words are introduced gradually (max ${SRS_NEW_PER_SESSION} at a time) so review doesn't pile up later; the rest will show up as more become due.</div>`
    : "";
  const modeLabel = state.sessionLabel ? ` (${state.sessionLabel})` : (state.weakMode ? " (Weakest Words session)" : "");
  const distinctWords = new Set(state.rounds.map(r => r.sourceWord.word)).size;
  const defSection = state.defStats.total > 0
    ? `<div class="report-section-title">Definitions</div>
    <div class="report-row"><div class="report-row-name">Word meanings</div><div class="report-row-bar"><div class="report-row-fill" style="width:${defPct}%; background:#7FA37F;"></div></div><div class="report-row-pct">${state.defStats.correct}/${state.defStats.total}</div></div>`
    : "";
  return `<div class="card"><div class="report-score"><div class="report-score-num">${pct}%</div><div class="report-score-label">${state.score} of ${total} correct overall (${distinctWords} word${distinctWords===1?"":"s"} this session${modeLabel})</div></div>
    ${defSection}
    <div class="report-section-title">Punctuation, by mark</div>
    ${markRows}
    <div class="btn-row"><button class="restart-btn" onclick="restart()">Back to dashboard</button><button class="restart-btn" onclick="showProgress()">View Progress</button></div>
    ${saveNote}
    ${pacingNote}</div>`;
}

function renderProgressScreen() {
  const entries = Object.entries(persistentStats);
  const totalAttempted = entries.length;
  if (totalAttempted === 0) return `<div class="card"><div class="back-link" onclick="restart()">&larr; Back</div><div class="wotd-label" style="font-size:18px; text-transform:none; letter-spacing:0;">Your Progress</div><div class="empty-note">No practice history yet -- once you complete a session, your results will start showing up here.</div></div>`;
  const defRanked = entries.filter(([w, s]) => s.defTotal > 0).map(([w, s]) => ({ word: w, correct: s.defCorrect, total: s.defTotal, pct: s.defCorrect / s.defTotal })).sort((a, b) => a.pct - b.pct || b.total - a.total).slice(0, 12);
  const punctRanked = entries.filter(([w, s]) => s.punctTotal > 0).map(([w, s]) => ({ word: w, correct: s.punctCorrect, total: s.punctTotal, pct: s.punctCorrect / s.punctTotal })).sort((a, b) => a.pct - b.pct || b.total - a.total).slice(0, 12);
  const markAgg = {};
  MARKS_ORDER.forEach(m => markAgg[MARK_NAMES[m]] = { correct: 0, total: 0, color: MARK_COLORS[m], symbol: m });
  entries.forEach(([w, s]) => { if (s.punctTotal === 0) return; const wordObj = WORDS.find(x => x.word === w); if (!wordObj) return; const name = MARK_NAMES[wordObj.correct]; markAgg[name].correct += s.punctCorrect; markAgg[name].total += s.punctTotal; });
  const defRows = defRanked.length ? defRanked.map(r => `<div class="weak-word-row"><div class="weak-word-name">${esc(r.word)}</div><div class="weak-word-stat">${r.correct}/${r.total} (${(r.pct*100).toFixed(0)}%)</div></div>`).join("") : `<div class="empty-note">No definition attempts recorded yet.</div>`;
  const punctRows = punctRanked.length ? punctRanked.map(r => `<div class="weak-word-row"><div class="weak-word-name">${esc(r.word)}</div><div class="weak-word-stat">${r.correct}/${r.total} (${(r.pct*100).toFixed(0)}%)</div></div>`).join("") : `<div class="empty-note">No punctuation attempts recorded yet.</div>`;
  const markRows = MARKS_ORDER.map(m => { const agg = markAgg[MARK_NAMES[m]]; if (agg.total === 0) return ""; const p = (agg.correct/agg.total)*100; return `<div class="report-row"><div class="report-row-name"><span class="report-row-mark" style="color:${agg.color};">${agg.symbol}</span> ${MARK_NAMES[m]}</div><div class="report-row-bar"><div class="report-row-fill" style="width:${p}%; background:${agg.color};"></div></div><div class="report-row-pct">${agg.correct}/${agg.total}</div><span class="mark-practice-link" onclick="startMarkPractice('${m}')">Practice &#9654;</span></div>`; }).join("");
  return `<div class="card"><div class="back-link" onclick="restart()">&larr; Back</div><div class="wotd-label" style="font-size:18px; text-transform:none; letter-spacing:0; margin-bottom:6px;">Your Progress</div><div class="q-prompt" style="margin-bottom:8px;">Based on all practice sessions so far -- ${totalAttempted} word${totalAttempted===1?"":"s"} attempted.</div>
    <div class="report-section-title">Punctuation marks, all-time</div>
    ${markRows || '<div class="empty-note">No punctuation attempts recorded yet.</div>'}
    <div class="report-section-title">Words to review -- definitions (weakest first)</div>
    ${defRows}
    <div class="report-section-title">Words to review -- punctuation (weakest first)</div>
    ${punctRows}
    <div class="reset-link" onclick="confirmReset()">Reset all progress data</div></div>`;
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function goToPicker() { state.screen = "picker"; render(); }
function toggleWotdSentence() { state.showWotdSentence = !state.showWotdSentence; render(); }
function toggleWotdDef() { state.showWotdDef = !state.showWotdDef; render(); }

async function start(targetLength) {
  const selection = buildSRSSelection(targetLength);
  const rounds = buildRoundsFromSRSSelection(selection);
  state = { screen: "q", rounds, i: 0, answered: false, sel: null, score: 0, defStats: {correct:0,total:0}, markStats: initMarkStats(), weakMode: false, showVoicePicker: false, showWotdSentence: false, showWotdDef: false, requestedLength: targetLength };
  render();
}
function startWeakest() {
  const weakAspects = getWeakestAspects(WEAK_SESSION_MAX);
  if (weakAspects.length < WEAK_SESSION_MIN) return;
  const rounds = shuffleArray(weakAspects).map(a => a.kind === "definition" ? buildDefRound(a.word) : buildPunctRound(a.word));
  state = { screen: "q", rounds, i: 0, answered: false, sel: null, score: 0, defStats: {correct:0,total:0}, markStats: initMarkStats(), weakMode: true, showVoicePicker: false, showWotdSentence: false, showWotdDef: false };
  render();
}
// Targeted practice on exactly one punctuation mark. Punctuation-only rounds
// (no definition questions) since the whole point is drilling that specific
// mark's judgment, not diluting the session with unrelated vocabulary recall.
const MARK_SESSION_SIZE = 20;
function startMarkPractice(mark) {
  const matchingWords = shuffleArray(WORDS.filter(w => w.correct === mark)).slice(0, MARK_SESSION_SIZE);
  if (matchingWords.length === 0) return;
  const rounds = matchingWords.map(w => ({ kind: "punctuation", sourceWord: w }));
  state = { screen: "q", rounds, i: 0, answered: false, sel: null, score: 0, defStats: {correct:0,total:0}, markStats: initMarkStats(), weakMode: true, sessionLabel: MARK_NAMES[mark] + " Practice", showVoicePicker: false, showWotdSentence: false, showWotdDef: false };
  render();
}
function pickDef(idx) {
  if (state.answered) return;
  const round = state.rounds[state.i]; const opt = round.options[idx];
  state.answered = true; state.sel = opt; state.defStats.total += 1;
  const correct = opt === round.correct; if (correct) { state.defStats.correct += 1; state.score += 1; }
  recordAttempt(round.sourceWord.word, "definition", correct);
  savePersistentStats(); savePersistentSRS(); render();
}
function pickMark(m) {
  if (state.answered) return;
  const round = state.rounds[state.i]; const w = round.sourceWord;
  state.answered = true; state.sel = m;
  const name = MARK_NAMES[w.correct]; const st = state.markStats[name]; st.total += 1;
  const correct = m === w.correct; if (correct) { st.correct += 1; state.score += 1; }
  recordAttempt(w.word, "punctuation", correct);
  savePersistentStats(); savePersistentSRS(); render();
}
function next() {
  if (state.i < state.rounds.length - 1) { state.i += 1; state.answered = false; state.sel = null; render(); }
  else {
    state.screen = "report";
    if (state.score === state.rounds.length) playCelebrationSound();
    render();
  }
}
function restart() { crosswordStopTimer(); state = { screen: "start", rounds: [], i: 0, answered: false, sel: null, score: 0, defStats: {correct:0,total:0}, markStats: {}, weakMode: false, showVoicePicker: false, showWotdSentence: false, showWotdDef: false }; render(); }
function showProgress() { state.screen = "progress"; render(); }
function confirmReset() { if (confirm("Clear all saved progress? This can't be undone.")) resetPersistentStats(); }

// ---------- Hangman ----------
const HANGMAN_MAX_WRONG = 6;
let hangmanState = null;
let hangmanUsedWords = new Set();

function startHangman() {
  hangmanUsedWords = new Set();
  hangmanState = pickNewHangmanWord();
  state = { screen: "hangman" };
  render();
}
function pickNewHangmanWord() {
  let pool = WORDS.filter(w => !hangmanUsedWords.has(w.word));
  if (pool.length === 0) { hangmanUsedWords = new Set(); pool = WORDS; }
  const word = pool[Math.floor(Math.random() * pool.length)];
  hangmanUsedWords.add(word.word);
  return { word, guessed: new Set(), wrong: 0, status: "playing" };
}
function hangmanGuess(letter) {
  if (!hangmanState || hangmanState.status !== "playing") return;
  letter = letter.toLowerCase();
  if (hangmanState.guessed.has(letter)) return;
  hangmanState.guessed.add(letter);
  const wordLower = hangmanState.word.word.toLowerCase();
  if (!wordLower.includes(letter)) {
    hangmanState.wrong++;
    if (hangmanState.wrong >= HANGMAN_MAX_WRONG) hangmanState.status = "lost";
  } else {
    // Every actual letter (a-z) in the word must be guessed; spaces/hyphens
    // display automatically and never need guessing (see renderHangman).
    const allLettersFound = wordLower.split("").every(ch => !/[a-z]/.test(ch) || hangmanState.guessed.has(ch));
    if (allLettersFound) {
      hangmanState.status = "won";
      if (hangmanState.wrong === 0) playCelebrationSound();
    }
  }
  render();
}
function nextHangmanWord() {
  hangmanState = pickNewHangmanWord();
  render();
}
function renderHangman() {
  const w = hangmanState.word;
  const wordLower = w.word.toLowerCase();
  const blanks = wordLower.split("").map(ch => {
    if (!/[a-z]/.test(ch)) return `<span class="hm-char hm-punct">${ch}</span>`;
    return `<span class="hm-char">${hangmanState.guessed.has(ch) ? ch : "_"}</span>`;
  }).join("");
  const livesLeft = HANGMAN_MAX_WRONG - hangmanState.wrong;
  const lifeDots = Array.from({length: HANGMAN_MAX_WRONG}, (_, i) =>
    `<span class="hm-life ${i < livesLeft ? "hm-life-on" : "hm-life-off"}"></span>`).join("");
  const QWERTY_ROWS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  const keyboard = QWERTY_ROWS.map((row, i) => {
    const keys = row.split("").map(l => {
      const guessed = hangmanState.guessed.has(l);
      const correct = guessed && wordLower.includes(l);
      const cls = !guessed ? "hm-key" : correct ? "hm-key hm-key-correct" : "hm-key hm-key-wrong";
      return `<button class="${cls}" onclick="hangmanGuess('${l}')" ${guessed ? "disabled" : ""}>${l}</button>`;
    }).join("");
    return `<div class="hm-kb-row hm-kb-row-${i + 1}">${keys}</div>`;
  }).join("");

  let resultBanner = "";
  if (hangmanState.status === "won") {
    resultBanner = `<div class="hm-result hm-win">Solved it! <button class="focus-btn-inline" onclick="nextHangmanWord()">Next word &rarr;</button></div>`;
  } else if (hangmanState.status === "lost") {
    resultBanner = `<div class="hm-result hm-lose">The word was <strong>${esc(w.word)}</strong>. <button class="focus-btn-inline" onclick="nextHangmanWord()">Next word &rarr;</button></div>`;
  }

  return `<div class="card">
    <div class="back-link" onclick="restart()">&larr; Dashboard</div>
    <div class="hm-lives">${lifeDots}<span class="hm-lives-label">${livesLeft} guess${livesLeft===1?"":"es"} left</span></div>
    <div class="hm-clue">${esc(w.definition)}</div>
    <div class="hm-word">${blanks}</div>
    ${resultBanner}
    <div class="hm-keyboard">${keyboard}</div>
  </div>`;
}

// ---------- Spelling Bee ----------
// Pangram-source words: exactly 7 unique letters, so the source word itself
// is always a valid, findable pangram -- guarantees every puzzle is solvable
// rather than risking a randomly-generated letter set with few or no words.
// Frequency-ranked common English words (from Google's Trillion Word Corpus
// via first20hours/google-10000-english), filtered to 4+ letters and at most
// 7 unique letters -- the only words that could ever matter for a 7-letter
// puzzle. This replaces a live dictionary API call entirely: instant, no

const BEE_SOURCE_WORDS = WORDS.filter(w => {
  const unique = new Set(w.word.toLowerCase().replace(/[^a-z]/g, ""));
  return unique.size === 7;
});
let beeState = null;

// Every valid answer for a given puzzle, computed once at generation time by
// scanning both the vocab list and the bundled common-words list -- this is
// what actually makes "max possible score" and "how many pangrams" honest
// answers, rather than a guess, since it's the same source used for real
// validation during play.
function computeBeeAnswers(letters, center) {
  const letterSet = new Set(letters);
  const seen = new Set();
  const answers = [];
  function tryAdd(word, isVocabWord) {
    if (word.length < 4) return;
    if (!word.includes(center)) return;
    if (![...word].every(ch => letterSet.has(ch))) return;
    if (seen.has(word)) return;
    seen.add(word);
    const pangram = letters.every(l => word.includes(l));
    const points = word.length === 4 ? 1 : word.length + (pangram ? 7 : 0);
    answers.push({ word, isVocabWord, pangram, points });
  }
  WORDS.forEach(w => tryAdd(w.word.toLowerCase(), true));
  BEE_COMMON_WORDS.forEach(w => tryAdd(w, false));
  return answers;
}

// Matches NYT's own "Genius" rank threshold exactly (70% of total possible
// points, not word count -- verified against NYT's actual mechanic rather
// than assumed). This is the practical "you've solved it" moment NYT itself
// treats as the real goal, distinct from the full 100% clear.
const BEE_SOLVED_PCT = 0.7;

function startBee() {
  const source = BEE_SOURCE_WORDS[Math.floor(Math.random() * BEE_SOURCE_WORDS.length)];
  const letters = [...new Set(source.word.toLowerCase())];
  const center = letters[Math.floor(Math.random() * letters.length)];
  const outer = shuffleArray(letters.filter(l => l !== center));
  const answers = computeBeeAnswers(letters, center);
  const maxScore = answers.reduce((sum, a) => sum + a.points, 0);
  const pangramCount = answers.filter(a => a.pangram).length;
  beeState = { letters, center, outer, input: "", found: [], score: 0, message: "", maxScore, pangramCount, totalAnswers: answers.length, answers, mistakes: 0, usedHint: false, solvedTriggered: false };
  state = { screen: "bee" };
  render();
}
function beeType(letter) { beeState.input += letter; render(); }
function beeBackspace() { beeState.input = beeState.input.slice(0, -1); render(); }
function beeClear() { beeState.input = ""; render(); }
function beeShuffle() { beeState.outer = shuffleArray(beeState.outer); render(); }
function beeIsPangram(word) { return beeState.letters.every(l => word.includes(l)); }

// Hints are only ever drawn from the vocab-list portion of the answer set --
// the common-word pool used for general "is this a real word" validation is
// just bare strings with no definition attached, so there's nothing honest
// to show as a hint for those. This means hints can genuinely run out for a
// given puzzle (most puzzles only have 1-2 vocab words among their valid
// answers), which the UI needs to say plainly rather than paper over.
function beeHint() {
  const unfoundVocabAnswers = beeState.answers.filter(a =>
    a.isVocabWord && !beeState.found.some(f => f.word === a.word)
  );
  if (unfoundVocabAnswers.length === 0) {
    beeState.message = "No more vocab-word hints left for this puzzle";
    render();
    return;
  }
  const pick = unfoundVocabAnswers[Math.floor(Math.random() * unfoundVocabAnswers.length)];
  const wordData = WORDS.find(w => w.word.toLowerCase() === pick.word);
  beeState.message = `Hint (${pick.word.length} letters): ${wordData.definition}`;
  beeState.usedHint = true;
  render();
}

function beeSubmit() {
  const word = beeState.input.toLowerCase().trim();
  beeState.input = "";
  if (word.length < 4) { beeState.mistakes++; beeState.message = "Too short -- 4 letters minimum"; render(); return; }
  if (!word.includes(beeState.center)) { beeState.mistakes++; beeState.message = `Must include the center letter (${beeState.center.toUpperCase()})`; render(); return; }
  if (![...word].every(ch => beeState.letters.includes(ch))) { beeState.mistakes++; beeState.message = "Uses a letter outside the set"; render(); return; }
  if (beeState.found.some(f => f.word === word)) { beeState.message = "Already found"; render(); return; }

  // Vocab list first -- the case worth celebrating, since it's what the
  // player is actually studying. Both checks are instant, local lookups now;
  // no network call means no file:// restriction and no waiting.
  const vocabMatch = WORDS.find(w => w.word.toLowerCase() === word);
  if (vocabMatch) { addBeeWord(word, true); return; }
  if (BEE_COMMON_WORDS.includes(word)) { addBeeWord(word, false); return; }
  beeState.mistakes++;
  beeState.message = "Not a recognized word";
  render();
}
function addBeeWord(word, isVocabWord) {
  const pangram = beeIsPangram(word);
  const points = word.length === 4 ? 1 : word.length + (pangram ? 7 : 0);
  beeState.found.push({ word, isVocabWord, pangram, points });
  beeState.score += points;
  beeState.message = pangram ? "Pangram! +" + points : isVocabWord ? "From your vocab list! +" + points : "+" + points;

  const isClean = beeState.mistakes === 0 && !beeState.usedHint;
  const isFullClear = beeState.found.length === beeState.totalAnswers;
  const pct = beeState.maxScore > 0 ? beeState.score / beeState.maxScore : 0;

  if (isFullClear) {
    // The biggest possible outcome. Also marks solvedTriggered so a puzzle
    // whose score happens to jump straight past 70% to 100% on the same
    // word doesn't fire the celebration sound twice in a row.
    beeState.solvedTriggered = true;
    if (isClean) playCelebrationSound();
  } else if (!beeState.solvedTriggered && pct >= BEE_SOLVED_PCT) {
    beeState.solvedTriggered = true;
    if (isClean) playCelebrationSound();
  }
  render();
}
function renderBee() {
  const s = beeState;
  const hexHtml = `
    <div class="bee-hex-wrap">
      <button class="bee-cell bee-cell-0" onclick="beeType('${s.outer[0]}')">${s.outer[0].toUpperCase()}</button>
      <button class="bee-cell bee-cell-1" onclick="beeType('${s.outer[1]}')">${s.outer[1].toUpperCase()}</button>
      <button class="bee-cell bee-cell-2" onclick="beeType('${s.outer[2]}')">${s.outer[2].toUpperCase()}</button>
      <button class="bee-cell bee-cell-center" onclick="beeType('${s.center}')">${s.center.toUpperCase()}</button>
      <button class="bee-cell bee-cell-3" onclick="beeType('${s.outer[3]}')">${s.outer[3].toUpperCase()}</button>
      <button class="bee-cell bee-cell-4" onclick="beeType('${s.outer[4]}')">${s.outer[4].toUpperCase()}</button>
      <button class="bee-cell bee-cell-5" onclick="beeType('${s.outer[5]}')">${s.outer[5].toUpperCase()}</button>
    </div>`;
  const foundList = s.found.length > 0
    ? `<div class="bee-found-list">${s.found.slice().sort((a, b) => a.word.localeCompare(b.word)).map(f => `<span class="bee-found-word ${f.isVocabWord ? "bee-found-vocab" : ""}">${esc(f.word)}${f.pangram ? " \u2605" : ""}</span>`).join("")}</div>`
    : `<div class="bee-empty-note">Words you find will show up here.</div>`;

  const isFullClear = s.found.length === s.totalAnswers;
  const solvedBanner = isFullClear ? `<div class="bee-solved">Full clear -- every word found!</div>`
    : s.solvedTriggered ? `<div class="bee-solved">Solved! (70%+ of possible points -- keep going for a full clear)</div>` : "";

  return `<div class="card">
    <div class="back-link" onclick="restart()">&larr; Dashboard</div>
    ${solvedBanner}
    <div class="bee-score-row"><span class="bee-score">${s.score} points</span><span class="bee-found-count">${s.found.length} word${s.found.length===1?"":"s"} found</span></div>
    <div class="bee-goal-row">Max ${s.maxScore} points across ${s.totalAnswers} words &middot; ${s.pangramCount} pangram${s.pangramCount===1?"":"s"} in this puzzle</div>
    <div class="bee-input">${esc(s.input.toUpperCase()) || "&nbsp;"}</div>
    <div class="bee-message">${esc(s.message)}</div>
    ${hexHtml}
    <div class="bee-controls">
      <button class="bee-ctrl-btn" onclick="beeBackspace()">Delete</button>
      <button class="bee-ctrl-btn" onclick="beeClear()">Clear</button>
      <button class="bee-ctrl-btn bee-submit-btn" onclick="beeSubmit()">Enter</button>
    </div>
    <div class="bee-controls">
      <button class="bee-ctrl-btn" onclick="beeHint()">Hint</button>
      <button class="bee-ctrl-btn" onclick="beeShuffle()">&#8635; Shuffle</button>
    </div>
    <div class="bee-found-section">
      <div class="bee-found-title">Found words</div>
      ${foundList}
    </div>
  </div>`;
}

// ---------- Crossword (mini, spine + crossing words) ----------
// Each puzzle was precomputed and verified letter-by-letter offline (see
// project notes) -- one horizontal "spine" word plus 4-5 vertical words that
// genuinely cross it at real shared letters. Embedding pre-verified puzzles
// rather than generating them live in the browser avoids re-deriving and
// re-verifying the same search logic in a second language.
let crosswordState = null;
let crosswordUsedPuzzles = new Set();

function compileCrosswordGrid(puzzle) {
  let maxAbove = 0, maxBelow = 0;
  puzzle.crossings.forEach(c => {
    maxAbove = Math.max(maxAbove, c.crossIdx);
    maxBelow = Math.max(maxBelow, c.word.length - 1 - c.crossIdx);
  });
  const spineRow = maxAbove;
  const height = maxAbove + 1 + maxBelow;
  const width = puzzle.spine.length;
  const cells = Array.from({length: height}, () => Array(width).fill(null));
  for (let col = 0; col < width; col++) cells[spineRow][col] = puzzle.spine[col];
  puzzle.crossings.forEach(c => {
    for (let i = 0; i < c.word.length; i++) cells[spineRow - c.crossIdx + i][c.col] = c.word[i];
  });
  return { width, height, cells, spineRow };
}

let crosswordTimerInterval = null;
function crosswordFormatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function crosswordStopTimer() {
  if (crosswordTimerInterval) { clearInterval(crosswordTimerInterval); crosswordTimerInterval = null; }
}
function crosswordStartTimer() {
  crosswordStopTimer();
  if (!crosswordTimerEnabled || !crosswordState) return;
  // Directly updates the timer display's text content every second rather
  // than calling render() -- a full re-render here would destroy whatever
  // grid cell currently has focus if the player is mid-keystroke when the
  // interval fires, the same failure mode that broke typing earlier.
  crosswordTimerInterval = setInterval(() => {
    crosswordState.elapsedSeconds++;
    const el = document.getElementById("cw-timer-display");
    if (el) el.textContent = crosswordFormatTime(crosswordState.elapsedSeconds);
  }, 1000);
}
function crosswordToggleTimer() {
  crosswordTimerEnabled = !crosswordTimerEnabled;
  saveCrosswordPrefs();
  if (crosswordTimerEnabled) crosswordStartTimer(); else crosswordStopTimer();
  render();
}
function crosswordToggleAutoCheck() {
  crosswordAutoCheckEnabled = !crosswordAutoCheckEnabled;
  saveCrosswordPrefs();
  render();
}

function startCrossword() {
  let pool = CROSSWORD_PUZZLES.filter(p => !crosswordUsedPuzzles.has(p.spine));
  if (pool.length === 0) { crosswordUsedPuzzles = new Set(); pool = CROSSWORD_PUZZLES; }
  const puzzle = pool[Math.floor(Math.random() * pool.length)];
  crosswordUsedPuzzles.add(puzzle.spine);
  const compiled = compileCrosswordGrid(puzzle);

  // Standard crossword numbering: across and down share ONE sequence,
  // assigned by reading order (top-to-bottom, left-to-right) across every
  // word-starting cell -- not two separate sequences. A down word whose top
  // cell sits above the spine row reads earlier than the spine itself, so
  // the across clue is not guaranteed to be "1" -- exactly like a real
  // puzzle, where numbering follows the grid, not word importance.
  const starts = [{ row: compiled.spineRow, col: 0, across: true }];
  puzzle.crossings.forEach(c => {
    const topRow = compiled.spineRow - c.crossIdx;
    starts.push({ row: topRow, col: c.col, crossing: c });
  });
  const byPos = new Map();
  starts.forEach(s => {
    const key = `${s.row},${s.col}`;
    if (!byPos.has(key)) byPos.set(key, { row: s.row, col: s.col });
    if (s.across) byPos.get(key).across = true;
    if (s.crossing) byPos.get(key).crossing = s.crossing;
  });
  const positions = [...byPos.values()].sort((a, b) => a.row - b.row || a.col - b.col);
  positions.forEach((p, i) => { p.number = i + 1; });

  const acrossNumber = positions.find(p => p.across).number;
  const downClues = positions.filter(p => p.crossing).map(p => ({
    ...p.crossing, number: p.number, topRow: p.row, col: p.col,
  })).sort((a, b) => a.number - b.number);

  crosswordState = {
    puzzle, compiled, downClues, acrossNumber,
    entered: Array.from({length: compiled.height}, () => Array(compiled.width).fill("")),
    checked: false, selected: null, revealed: new Set(), direction: "across", hadError: false, everUsedHelp: false,
    elapsedSeconds: 0,
  };
  state = { screen: "crossword" };
  crosswordStartTimer();
  render();
}
function crosswordSelectCell(row, col) {
  const { compiled, puzzle } = crosswordState;
  const isAcrossRow = row === compiled.spineRow;
  const hasDownHere = puzzle.crossings.some(c => c.col === col);
  if (isAcrossRow && hasDownHere) {
    // Intersection cell: keep whatever direction was already active rather
    // than guessing, since either across or down is equally valid here.
    if (!crosswordState.direction) crosswordState.direction = "across";
  } else {
    crosswordState.direction = isAcrossRow ? "across" : "down";
  }
  crosswordState.selected = { row, col };
  // Deliberately no render() here. Re-rendering the grid the instant a cell
  // receives focus would destroy and recreate that same input immediately
  // -- the same failure mode that broke typing, just one step earlier.
  // Update only the things that actually need to change, directly.
  const btn = document.getElementById("cw-reveal-letter-btn");
  if (btn) btn.disabled = false;
  const hint = document.getElementById("cw-hint-note");
  if (hint) hint.textContent = "Tap \u201cReveal letter\u201d to fill the selected square.";
  const clueBar = document.getElementById("cw-current-clue");
  if (clueBar) clueBar.textContent = getCurrentClueText();
}
// Shared by crosswordSelectCell (direct DOM update, no re-render, so typing
// and auto-advance stay reliable) and renderCrossword (initial paint) --
// keeping this in one place means the two can't drift out of sync.
function getCurrentClueText() {
  const { puzzle, downClues, selected, direction, acrossNumber } = crosswordState;
  if (!selected) return "Tap a square to see its clue here.";
  if (direction === "across") return `${acrossNumber} Across: ${puzzle.spineDef}`;
  const activeDown = downClues.find(d => d.col === selected.col);
  return activeDown ? `${activeDown.number} Down: ${activeDown.def}` : "Tap a square to see its clue here.";
}
// Every word in the puzzle -- the single across spine plus each down word --
// as an ordered list of its own cells, sorted by clue number. Used to find
// "the next word" when the player finishes typing the current one.
function getAllCrosswordWords() {
  const { compiled, downClues, acrossNumber } = crosswordState;
  const words = [];
  const acrossCells = [];
  for (let c = 0; c < compiled.width; c++) acrossCells.push([compiled.spineRow, c]);
  words.push({ number: acrossNumber, direction: "across", cells: acrossCells });
  downClues.forEach(d => {
    const cells = [];
    for (let i = 0; i < d.word.length; i++) cells.push([d.topRow + i, d.col]);
    words.push({ number: d.number, direction: "down", cells });
  });
  words.sort((a, b) => a.number - b.number);
  return words;
}
function getCurrentWordNumber() {
  const { direction, selected, downClues, acrossNumber } = crosswordState;
  if (!selected) return null;
  if (direction === "across") return acrossNumber;
  const activeDown = downClues.find(d => d.col === selected.col);
  return activeDown ? activeDown.number : null;
}
// Finds the next word after currentNumber, in clue-number order and wrapping
// around, that still has at least one empty cell -- and specifically returns
// its first EMPTY cell, not just its first cell, since some of that word's
// cells may already be filled from earlier intersections with other words.
function findNextWordWithEmptyCell(currentNumber) {
  const words = getAllCrosswordWords();
  const { entered } = crosswordState;
  const startIdx = words.findIndex(w => w.number === currentNumber);
  if (startIdx === -1) return null;
  for (let i = 1; i <= words.length; i++) {
    const candidate = words[(startIdx + i) % words.length];
    const emptyCell = candidate.cells.find(([r, c]) => entered[r][c] === "");
    if (emptyCell) return { word: candidate, cell: emptyCell };
  }
  return null;
}
function crosswordAdvance(row, col, delta) {
  // Moves focus one cell forward (delta=1, after typing a letter) or
  // backward (delta=-1, after deleting) along the current direction. No
  // re-render involved -- the target input already exists in the DOM, so
  // this is just a direct, reliable .focus() call.
  const { compiled, direction } = crosswordState;
  const nextRow = direction === "down" ? row + delta : row;
  const nextCol = direction === "across" ? col + delta : col;
  const inBounds = nextRow >= 0 && nextRow < compiled.height && nextCol >= 0 && nextCol < compiled.width;
  const isOpenCell = inBounds && compiled.cells[nextRow][nextCol] !== null;
  if (isOpenCell) {
    const el = document.getElementById(`cw-input-${nextRow}-${nextCol}`);
    if (el) el.focus();
    return;
  }
  // Reached the end of the current word. When typing forward specifically,
  // jump to the next word (by clue number, wrapping around) that still has
  // an empty cell. Backspacing past the start of a word deliberately does
  // nothing further -- jumping to a different word on delete would be
  // surprising, and wasn't what was asked for.
  if (delta === 1) {
    const currentNumber = getCurrentWordNumber();
    if (currentNumber !== null) {
      const next = findNextWordWithEmptyCell(currentNumber);
      if (next) {
        const [nr, nc] = next.cell;
        const el = document.getElementById(`cw-input-${nr}-${nc}`);
        if (el) el.focus();
      }

  }
}
function crosswordKeyDown(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    crosswordCheck();
  }
}
function crosswordInput(row, col, value) {
  const letter = value.slice(-1).toUpperCase();
  if (letter && !/[A-Z]/.test(letter)) return;
  crosswordState.entered[row][col] = letter;
  crosswordState.revealed.delete(`${row},${col}`);
  crosswordState.checked = false;
  playClickSound();
  if (crosswordAutoCheckEnabled) crosswordApplyAutoCheckStyle(row, col);
  // No re-render for ordinary typing either. The browser already displays
  // the typed character natively -- replacing innerHTML here would destroy
  // the very input mid-keystroke, and on mobile a virtual keyboard that
  // gets dismissed this way doesn't reliably reappear just because a new
  // element calls .focus() afterward. Only re-render once the puzzle is
  // actually complete, since continued typing in this cell isn't expected
  // at that point -- the interaction is naturally over.
  if (crosswordIsComplete()) {
    crosswordStopTimer();
    if (!crosswordState.everUsedHelp && !crosswordState.hadError) playCelebrationSound();
    render();
    return;
  }
  crosswordAdvance(row, col, letter ? 1 : -1);
}
// Direct DOM update, mirroring the same no-full-render approach used
// everywhere else during typing. Also records hadError for a wrong letter,
// consistent with what manually pressing Check would record -- auto-check
// revealing a mistake should disqualify a "clean" completion the same way.
function crosswordApplyAutoCheckStyle(row, col) {
  const input = document.getElementById(`cw-input-${row}-${col}`);
  if (!input) return;
  const cellDiv = input.parentElement;
  cellDiv.classList.remove("cw-cell-correct", "cw-cell-wrong", "cw-cell-empty");
  const entered = crosswordState.entered[row][col];
  if (entered === "") return;
  const correct = crosswordState.compiled.cells[row][col];
  if (entered.toLowerCase() === correct) {
    cellDiv.classList.add("cw-cell-correct");
  } else {
    cellDiv.classList.add("cw-cell-wrong");
    crosswordState.hadError = true;
  }
}
function crosswordRevealLetter() {
  const sel = crosswordState.selected;
  if (!sel) return;
  const correct = crosswordState.compiled.cells[sel.row][sel.col];
  if (correct === null) return;
  crosswordState.entered[sel.row][sel.col] = correct.toUpperCase();
  crosswordState.revealed.add(`${sel.row},${sel.col}`);
  crosswordState.everUsedHelp = true;
  render();
}
function crosswordRevealWord(type, col) {
  const { compiled, puzzle } = crosswordState;
  if (type === "across") {
    for (let c = 0; c < compiled.width; c++) {
      crosswordState.entered[compiled.spineRow][c] = puzzle.spine[c].toUpperCase();
      crosswordState.revealed.add(`${compiled.spineRow},${c}`);
    }
  } else {
    const cr = puzzle.crossings.find(c => c.col === col);
    if (!cr) return;
    const topRow = compiled.spineRow - cr.crossIdx;
    for (let i = 0; i < cr.word.length; i++) {
      crosswordState.entered[topRow + i][cr.col] = cr.word[i].toUpperCase();
      crosswordState.revealed.add(`${topRow + i},${cr.col}`);
    }
  }
  crosswordState.everUsedHelp = true;
  render();
}
function crosswordCheck() {
  crosswordState.checked = true;
  const { compiled, entered } = crosswordState;
  for (let r = 0; r < compiled.height; r++) {
    for (let c = 0; c < compiled.width; c++) {
      if (compiled.cells[r][c] !== null && entered[r][c] !== "" && entered[r][c].toLowerCase() !== compiled.cells[r][c]) {
        crosswordState.hadError = true;
      }
    }
  }
  render();
}
function crosswordIsComplete() {
  const { compiled, entered } = crosswordState;
  for (let r = 0; r < compiled.height; r++) {
    for (let c = 0; c < compiled.width; c++) {
      if (compiled.cells[r][c] !== null && entered[r][c].toLowerCase() !== compiled.cells[r][c]) return false;

  }

      }
      const isAcrossStart = r === compiled.spineRow && c === 0;
      const downClueHere = downClues.find(d => d.topRow === r && d.col === c);
      const numLabel = isAcrossStart ? `<span class="cw-cell-num">${crosswordState.acrossNumber}</span>`
        : downClueHere ? `<span class="cw-cell-num">${downClueHere.number}</span>` : "";
      let cellClass = "cw-cell";
      if (revealed.has(`${r},${c}`)) cellClass += " cw-cell-revealed";
      if (checked) {
        const isFilled = entered[r][c] !== "";
        const isCorrect = entered[r][c].toLowerCase() === compiled.cells[r][c];
        cellClass += isFilled ? (isCorrect ? " cw-cell-correct" : " cw-cell-wrong") : " cw-cell-empty";
      }
      gridHtml += `<div class="${cellClass}"><input id="cw-input-${r}-${c}" maxlength="1" value="${entered[r][c]}" oninput="crosswordInput(${r},${c},this.value)" onfocus="crosswordSelectCell(${r},${c})" onkeydown="crosswordKeyDown(event)">${numLabel}</div>`;
    }
  }
  gridHtml += `</div>`;

  const downCluesHtml = downClues.map(d => `<div class="cw-clue"><span class="cw-clue-num">${d.number}.</span> ${esc(d.def)} <span class="cw-reveal-link" onclick="crosswordRevealWord('down', ${d.col})">Reveal</span></div>`).join("");

  const finalTime = crosswordTimerEnabled ? ` in ${crosswordFormatTime(crosswordState.elapsedSeconds)}` : "";
  const solvedBanner = solved ? `<div class="cw-solved">Solved it!${esc(finalTime)}</div>` : "";
  const revealLetterDisabled = selected ? "" : "disabled";
  const timerDisplay = crosswordTimerEnabled ? `<span id="cw-timer-display" class="cw-timer">${crosswordFormatTime(crosswordState.elapsedSeconds)}</span>` : "";
  const settingsRow = `<div class="cw-settings-row">
    <span class="cw-setting-toggle ${crosswordTimerEnabled ? "on" : ""}" onclick="crosswordToggleTimer()">&#9201; Timer</span>
    <span class="cw-setting-toggle ${crosswordAutoCheckEnabled ? "on" : ""}" onclick="crosswordToggleAutoCheck()">&#10003; Auto-check</span>
    ${timerDisplay}
  </div>`;

  return `<div class="card">
    <div class="back-link" onclick="restart()">&larr; Dashboard</div>
    ${solvedBanner}
    ${settingsRow}
    <div id="cw-current-clue" class="cw-current-clue">${esc(currentClueText)}</div>
    ${gridHtml}
    <div class="cw-check-row">
      <button class="bee-ctrl-btn" onclick="crosswordCheck()">Check answers</button>
      <button id="cw-reveal-letter-btn" class="bee-ctrl-btn" onclick="crosswordRevealLetter()" ${revealLetterDisabled}>Reveal letter</button>
      <button class="bee-ctrl-btn" onclick="startCrossword()">New puzzle</button>
    </div>
    <div id="cw-hint-note" class="cw-hint-note">${selected ? "Tap \u201cReveal letter\u201d to fill the selected square." : "Tap a square, then \u201cReveal letter\u201d if you're stuck on it."}</div>
    <div class="cw-clues-section">
      <div class="cw-clue-group-title">Across</div>
      <div class="cw-clue"><span class="cw-clue-num">${crosswordState.acrossNumber}.</span> ${esc(puzzle.spineDef)} <span class="cw-reveal-link" onclick="crosswordRevealWord('across')">Reveal</span></div>
      <div class="cw-clue-group-title" style="margin-top:14px;">Down</div>
      ${downCluesHtml}
    </div>
  </div>`;
}

// ---------- Interaction feedback (click sound) ----------
// Synthesized via Web Audio rather than an audio file, keeping this a
// single self-contained HTML file with no external assets. Lazy-initialized
// on first use since browsers require a user gesture before audio can
// play -- creating the context inside a click handler satisfies that
// automatically, with no special-casing needed.
let audioCtx = null;
function playClickSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.045);
  } catch (e) { /* audio unavailable or blocked -- fail silently, never break interaction */ }
}
// A distinct, brighter chime for clean completions -- a short ascending
// major arpeggio (C-E-G-C), the same synthesis approach as the click sound
// but clearly different in character so the two are never confused.
function playCelebrationSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const t = audioCtx.currentTime + i * 0.09;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t);
      osc.stop(t + 0.25);
    });
  } catch (e) { /* audio unavailable or blocked -- fail silently, never break interaction */ }
}
// One delegated listener on the stable #app container (which persists
// across re-renders even though its innerHTML is replaced) catches every
// button press app-wide -- quiz choices, Hangman keys, Spelling Bee's
// hexagon and controls, Crossword's buttons, dashboard navigation -- all
// automatically, without threading a sound call through every individual
// handler function separately.
function setupClickFeedback() {
  const app = document.getElementById("app");
  if (app) app.addEventListener("click", (e) => { if (e.target.closest("[onclick]")) playClickSound(); });
}

async function init() {
  await loadPersistentStats();
  await loadPersistentSRS();
  await loadStreakData();
  await loadVoicePreference();
  await loadCrosswordPrefs();
  if (SPEECH_SUPPORTED) { refreshVoices(); window.speechSynthesis.onvoiceschanged = () => { refreshVoices(); render(); }; }
  setupClickFeedback();
  render();
}
init();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("vocab-service-worker.js").catch(() => {});
  });
}
</script>
